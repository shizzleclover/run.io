name: runio
description: "run.io: claim your city."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  mapbox_maps_flutter: ^3.33.1
  geolocator: ^14.0.1
  path_provider: ^2.1.6
  wakelock_plus: ^1.8.2
  share_plus: ^13.3.1
  flutter_riverpod: ^3.4.3
  go_router: ^18.1.1
  google_fonts: ^8.2.1
  image_picker: ^1.2.4
  phosphor_flutter: ^2.1.0
  flutter_local_notifications: ^22.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  change_app_package_name: ^1.5.0

flutter:
  uses-material-design: true